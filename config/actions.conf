# Stage 2 (2026-10-12): rspamd acts on its scores. It ran observe-only from 2026-10-05 (#4) and the
# week was reviewed first (#5): of 2,089 messages, everything that scored 10 or more was spam, and
# nothing ordinary scored above 6. The nearest was Alertmanager's own mail at 5.41, mostly for its
# long subjects.
#
# add_header only labels the message (X-Spam: Yes); nothing moves it to Junk, which would need a
# sieve rule in dovecot. Greylisting stays off for good, because forwarded and first-contact mail
# would wait minutes for every new sender.
reject = 15;
add_header = 6;
rewrite_subject = null;
greylist = null;
