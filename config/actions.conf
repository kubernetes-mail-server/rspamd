# Stage 1 of reconnecting rspamd to postfix (2026-10-05): observe only. rspamd scores every message
# and adds its headers (milter_headers.conf), but takes no action, so a bad score cannot hold up or
# lose mail while the scores are reviewed. Stage 2 restores reject and add_header; greylisting stays
# off for good, because forwarded and first-contact mail would wait minutes for every new sender.
reject = null;
add_header = null;
rewrite_subject = null;
greylist = null;
